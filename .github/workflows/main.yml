name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        run: |
          # Enable Remote Desktop and disable Network Level Authentication
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                           -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                           -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                           -Name "SecurityLayer" -Value 0 -Force

          # Remove any existing firewall rule to avoid duplication
          netsh advfirewall firewall delete rule name="RDP-Public"
          
          # Allow incoming connection on port 3389 for public access
          netsh advfirewall firewall add rule name="RDP-Public" `
            dir=in action=allow protocol=TCP localport=3389

          # Restart the Remote Desktop service to ensure changes take effect
          Restart-Service -Name TermService -Force

      - name: Create RDP User
        run: |
          $password = "Onsi0123456"
          net user RDP $password /add
          net localgroup Administrators RDP /add
          net localgroup "Remote Desktop Users" RDP /add
          
          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV

      - name: Get Public IP and Maintain Connection
        run: |
          # Fetch public IP of the GitHub Actions runner
          $publicIP = (Invoke-RestMethod -Uri "https://api.ipify.org")
          
          Write-Host "`n=== PUBLIC RDP ACCESS ==="
          Write-Host "Address: $publicIP"
          Write-Host "Username: RDP"
          Write-Host "Password: Onsi0123456"
          Write-Host "==========================`n"
          
          # Keep runner active
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - Public IP: $publicIP"
              Start-Sleep -Seconds 300
          }
